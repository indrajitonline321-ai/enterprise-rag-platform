services:
  postgres:
    image: postgres:16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5432:5432"
    volumes:
      # Reference the named volume defined below
      - postgres_data:/var/lib/postgresql/data 

volumes:
  # Define the named volume
  postgres_data:
    driver: local
